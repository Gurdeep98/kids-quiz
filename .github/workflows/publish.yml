name: Publish daily math video

on:
  schedule:
    # 08:00 UTC every day. Change the cron to adjust cadence.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      visibility:
        description: 'Video visibility (private/unlisted/public)'
        default: private
      table:
        description: 'Optional: force a specific table (e.g. 7 or "mixed"). Blank = use the schedule.'
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # System libraries Remotion's headless Chromium needs on Ubuntu.
      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
            libgbm1 libasound2t64 libxkbcommon0 libgtk-3-0 libx11-xcb1

      - run: npm ci

      - name: Produce and upload
        run: npm run produce -- --visibility="${{ github.event.inputs.visibility || 'private' }}" ${{ github.event.inputs.table }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Optional: omit to publish silent videos.
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
